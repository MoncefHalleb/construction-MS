<mat-card class="mx-auto my-5 p-4 shadow" style="max-width: 600px;">
    <h3 class="text-center mb-4">✏️ Update Profile</h3>
    <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label class="form-label">Login</label>
        <input class="form-control" formControlName="login" />
      </div>
  
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input class="form-control" formControlName="email" [attr.disabled]="true" />
      </div>
  
      <div class="mb-3">
        <label class="form-label">First Name</label>
        <input class="form-control" formControlName="firstName" />
      </div>
  
      <div class="mb-3">
        <label class="form-label">Last Name</label>
        <input class="form-control" formControlName="lastName" />
      </div>
  
      <div class="d-flex justify-content-end">
        <button mat-raised-button color="primary" type="submit">Save</button>
        <button mat-button color="warn" class="ms-2" (click)="cancel()">Cancel</button>
      </div>
    </form>
  </mat-card>
